baseURL: http://iagosaito.com
defaultContentLanguage: pt
defaultContentLanguageInSubdir: false
title: iagosaito.com
theme: "PaperMod"
services:
  googleAnalytics:
    id: G-75TR585LH3

params:
  author:
    name: Iago Saito
    email: iago@email.com
  socialIcons:
    - name: github
      url: https://github.com/iagosaito
    - name: spotify
      url: https://open.spotify.com/user/iagosaito?si=bd12e50a5615400d
    - name: goodreads
      url: https://www.goodreads.com/user/show/164680356-iago-saito
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  cusdis:
    # Required: set this to your Cusdis App ID from https://cusdis.com/
    appId: "7d8954cd-fd07-49cc-9bc3-01b61fb1da61"
    # Optional: override only if self-hosting Cusdis
    host: https://cusdis.com
    # Optional: force widget theme; "light" avoids unreadable labels in dark mode
    theme: light
    # Optional: widget language (for example: en, pt-BR)
    lang: ""
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: false
    style: github-dark

languages:
  pt:
    label: Português
    locale: pt-BR
    weight: 1
    title: iagosaito.com
    params:
      cusdisLang: pt-BR
      homeInfoParams:
        content: "Ninguém lê mais nada hoje em dia, mas continuo a escrever mesmo assim.
          Muito sobre tech, um pouco sobre a vida; mas honesto, como deveria ser. Abraços!"
    menus:
      main:
        - identifier: categories
          name: Categorias
          url: /categories/
          weight: 10
        - identifier: tags
          name: Tags
          url: /tags/
          weight: 20
        - identifier: archive
          name: Arquivo
          url: /archives/
          weight: 30
  es:
    label: Español
    locale: es-ES
    weight: 3
    title: iagosaito.com
    params:
      cusdisLang: es
      homeInfoParams:
        content: "Hoy en día ya nadie lee nada, pero sigo escribiendo de todos modos.
          Mucho sobre tecnología, un poco sobre la vida; pero honesto, como debe ser. ¡Un abrazo!"
    menus:
      main:
        - identifier: categories
          name: Categorías
          url: /categories/
          weight: 10
        - identifier: tags
          name: Etiquetas
          url: /tags/
          weight: 20
        - identifier: archive
          name: Archivo
          url: /archives/
          weight: 30
  en:
    label: English
    locale: en-US
    weight: 2
    title: iagosaito.com
    params:
      cusdisLang: en
      homeInfoParams:
        content: "Nobody reads anything these days, but I keep writing anyway.
          A lot about tech, a little about life; but honest, as it should be. Cheers!"
    menus:
      main:
        - identifier: categories
          name: Categories
          url: /categories/
          weight: 10
        - identifier: tags
          name: Tags
          url: /tags/
          weight: 20
        - identifier: archive
          name: Archive
          url: /archives/
          weight: 30
